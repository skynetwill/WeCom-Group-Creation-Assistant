# ===================== 开发环境配置 =====================

# 认证：开发环境启用登录
app.auth.enabled=true
app.auth.lock-threshold=5
app.auth.lock-duration=15
app.auth.max-sessions=5
app.auth.remember-me-validity-days=14
app.auth.password-expiry-days=90
app.auth.password-history-size=5
# app.auth.mfa.enabled=true  # 需要时可开启 MFA

# 企业微信配置
wechat.work.corpid=wwce6b569b8529bd53
wechat.work.corpsecret=XOYMZI7T3VHq5G6wgce4MXMPnUnkTIhGfvETnRLERvM
wechat.work.agentid=1000004

# 数据库（开发环境使用 H2 内存数据库，无需安装 MySQL）
spring.datasource.url=jdbc:h2:mem:wechat_group;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Web 控制台（可选，访问 http://localhost:8082/h2-console）
spring.h2.console.enabled=true

# JPA：开发环境自动建表，打印 SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 数据库专用方言（覆盖公共配置的 MySQLDialect）
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 日志级别
logging.level.com.school.wechatgroup=DEBUG

# Actuator 健康检查
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# 消息队列（开发环境不自动重连，避免阻塞启动）
spring.rabbitmq.listener.simple.auto-startup=false
spring.kafka.listener.auto-startup=false

# Thymeleaf（开发环境禁用缓存，加速模板调试）
spring.thymeleaf.cache=false
