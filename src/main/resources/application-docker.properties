# ===================== Docker 分布式环境配置 =====================

# 认证：启用
app.auth.enabled=true
app.auth.lock-threshold=5
app.auth.lock-duration=15
app.auth.max-sessions=5
app.auth.remember-me-validity-days=14
app.auth.password-expiry-days=90
app.auth.password-history-size=5

# 企业微信（通过 docker-compose 环境变量注入）
wechat.work.corpid=${WECHAT_CORPID}
wechat.work.corpsecret=${WECHAT_CORPSECRET}
wechat.work.agentid=${WECHAT_AGENTID}

# MySQL 数据库（docker-compose 中名为 mysql 的服务）
spring.datasource.url=jdbc:mysql://mysql:3306/wechat_group?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=wechat_app
spring.datasource.password=wechat_pass_2024
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.com.school.wechatgroup=INFO

# HikariCP 连接池（每个实例分配 10 连接，3 实例共 30）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Redis — 共享 Session（docker-compose 中名为 redis 的服务）
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.session.store-type=redis
spring.session.redis.namespace=wechat-group:sessions

# Redis 连接池
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Actuator 健康检查（供 Docker healthcheck 和 Nginx 使用）
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 文件上传
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
