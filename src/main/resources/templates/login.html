<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - WeChat Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #a855f7;
            --accent: #ec4899;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f1a;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* Animated gradient background */
        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        .bg-animation::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            left: -100px;
            animation: float1 12s ease-in-out infinite;
            opacity: 0.3;
            filter: blur(80px);
        }
        .bg-animation::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            animation: float2 15s ease-in-out infinite;
            opacity: 0.3;
            filter: blur(80px);
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, 50px) scale(1.1); }
            66% { transform: translate(-50px, -50px) scale(0.9); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-80px, -80px) scale(1.2); }
            66% { transform: translate(80px, 50px) scale(0.8); }
        }

        /* Grid pattern overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        /* Login container */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 48px 36px 36px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5),
                        0 0 0 1px rgba(255,255,255,0.05) inset;
            animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes cardEntry {
            to { transform: translateY(0); opacity: 1; }
        }

        .login-card:hover {
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 30px 100px rgba(0,0,0,0.6),
                        0 0 0 1px rgba(255,255,255,0.08) inset,
                        0 0 60px rgba(99,102,241,0.1);
            transition: all 0.5s ease;
        }

        /* Logo / Icon area */
        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(99,102,241,0.4);
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(99,102,241,0.4); }
            50% { box-shadow: 0 8px 48px rgba(168,85,247,0.6); }
        }

        .logo-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #e0e7ff, #c4b5fd, #f0abfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }
        .logo-subtitle {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Form inputs */
        .input-group-custom {
            position: relative;
            margin-bottom: 24px;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 18px;
            z-index: 2;
            transition: color 0.3s;
        }
        .form-control-custom {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
        }
        .form-control-custom::placeholder { color: rgba(255,255,255,0.25); }
        .form-control-custom:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.15),
                        0 0 20px rgba(99,102,241,0.1);
        }
        .form-control-custom:focus ~ .input-icon,
        .input-group-custom:focus-within .input-icon {
            color: var(--primary);
        }

        /* Login button */
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-login:hover::before { opacity: 1; }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(99,102,241,0.4);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-login span { position: relative; z-index: 1; }

        /* Error message */
        .alert-custom {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fca5a5;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s ease;
            backdrop-filter: blur(10px);
        }
        .alert-custom.show { display: block; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Loading dots */
        @keyframes dots { 0%,20% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        .dot { animation: dots 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        /* Particles */
        .particle {
            position: fixed;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 8s linear infinite;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>
    <div id="particles"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="bi bi-wechat"></i>
                </div>
                <div class="logo-title">WeChat Group</div>
                <div class="logo-subtitle">企业微信 · 批量建群管理</div>
            </div>

            <div id="alertBox" class="alert-custom show" style="display:none"></div>

            <form id="loginForm">
                <div class="input-group-custom">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" class="form-control-custom" id="username"
                           placeholder="用户名" required autocomplete="username">
                </div>
                <div class="input-group-custom">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" class="form-control-custom" id="password"
                           placeholder="密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span>登录系统</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Floating particles
        (function() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 4 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 10 + 8) + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(p);
            }
        })();

        const alertBox = document.getElementById('alertBox');
        const loginBtn = document.getElementById('loginBtn');

        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
            alertBox.classList.add('show');
            setTimeout(() => { alertBox.classList.remove('show'); }, 100);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.querySelector('span').innerHTML =
                '验证中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
            alertBox.style.display = 'none';

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            fetch('/api/auth/csrf')
                .then(r => r.json())
                .then(csrf => fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'X-CSRF-TOKEN': csrf.token },
                    body: formData
                }))
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.querySelector('.login-card').style.transform = 'scale(0.95)';
                        document.querySelector('.login-card').style.opacity = '0';
                        document.querySelector('.login-card').style.transition = 'all 0.4s ease';
                        setTimeout(() => { window.location.href = '/index'; }, 400);
                    } else {
                        showAlert(data.message || '用户名或密码错误');
                    }
                })
                .catch(() => showAlert('网络错误，请检查后端服务'))
                .then(() => {
                    loginBtn.disabled = false;
                    loginBtn.querySelector('span').textContent = '登录系统';
                });
        });

        // Enter key to submit
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !loginBtn.disabled) {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
