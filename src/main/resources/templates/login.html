<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 企业微信批量建群工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .card-header {
            border-radius: 16px 16px 0 0 !important;
        }
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <h4 class="mb-1">企业微信批量建群工具</h4>
                        <small class="opacity-75">请使用管理员账号登录</small>
                    </div>
                    <div class="card-body p-4">
                        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" placeholder="请输入用户名" required autocomplete="username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" placeholder="请输入密码" required autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                                登 录
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center text-muted small">
                        &copy; 2026 企业微信批量建群工具
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const loginBtn = document.getElementById('loginBtn');

        function showAlert(msg, type) {
            alertBox.textContent = msg;
            alertBox.className = 'alert alert-' + type;
            alertBox.classList.remove('d-none');
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>正在登录...';
            alertBox.classList.add('d-none');

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            fetch('/api/auth/csrf')
                .then(function(r) { return r.json(); })
                .then(function(csrf) {
                    return fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'X-CSRF-TOKEN': csrf.token },
                        body: formData
                    });
                })
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.success) {
                        window.location.href = '/index';
                    } else {
                        showAlert(data.message || '登录失败', 'danger');
                    }
                })
                .catch(function() {
                    showAlert('网络错误，请检查后端服务是否正常', 'danger');
                })
                .then(function() {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '登 录';
                });
        });
    </script>
</body>
</html>
