# ===================== 公共配置（所有环境共享） =====================
server.port=8082

# 激活的 profile（dev=开发 / prod=生产）
spring.profiles.active=dev

# 应用访问地址
app.base-url=https://electrometallurgical-unstatuesquely-vivian.ngrok-free.dev

# 登录认证默认账号
app.auth.default-username=admin
app.auth.default-password=admin123

# JPA 公共配置
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# AOP 代理暴露（演示 AopContext.currentProxy()）
spring.aop.proxy-target-class=true
spring.aop.expose-proxy=true

# 优雅停机（kill -15 时等待现有请求处理完）
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Session Cookie 安全配置
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 文件上传限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf 配置
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
