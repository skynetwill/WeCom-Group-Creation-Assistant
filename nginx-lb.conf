worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 上游服务器池 — 3 个 Spring Boot 实例
    upstream app_cluster {
        # ip_hash: 同一 IP 粘滞到同一实例（验证 Redis Session 时注释掉）
        # ip_hash;

        server app1:8082 weight=1 max_fails=3 fail_timeout=30s;
        server app2:8082 weight=1 max_fails=3 fail_timeout=30s;
        server app3:8082 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # 安全响应头
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 上传文件大小限制
        client_max_body_size 10M;

        location / {
            proxy_pass http://app_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
