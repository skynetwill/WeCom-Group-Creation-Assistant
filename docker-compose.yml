version: "3.8"

# ──────────────────────────────────────────
#  企业微信批量建群 — Docker 多实例分布式部署
#  6 容器: nginx + app1~3 + mysql + redis
# ──────────────────────────────────────────

services:
  # ==================== Nginx 负载均衡 ====================
  nginx:
    image: nginx:alpine
    container_name: wg-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ==================== Spring Boot 实例 x3 ====================
  app1:
    build: .
    container_name: wg-app1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      # === 分布式必须共享的密钥 ===
      JWT_SECRET: "WcGr0up-D1str1but3d-S3cr3t-K3y-2024!P1easeChangeMe"
      # === 企业微信凭证（从 .env 文件或流水线注入） ===
      WECHAT_CORPID: "${WECHAT_CORPID:-请替换}"
      WECHAT_CORPSECRET: "${WECHAT_CORPSECRET:-请替换}"
      WECHAT_AGENTID: "${WECHAT_AGENTID:-请替换}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  app2:
    build: .
    container_name: wg-app2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      JWT_SECRET: "WcGr0up-D1str1but3d-S3cr3t-K3y-2024!P1easeChangeMe"
      WECHAT_CORPID: "${WECHAT_CORPID:-请替换}"
      WECHAT_CORPSECRET: "${WECHAT_CORPSECRET:-请替换}"
      WECHAT_AGENTID: "${WECHAT_AGENTID:-请替换}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  app3:
    build: .
    container_name: wg-app3
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      JWT_SECRET: "WcGr0up-D1str1but3d-S3cr3t-K3y-2024!P1easeChangeMe"
      WECHAT_CORPID: "${WECHAT_CORPID:-请替换}"
      WECHAT_CORPSECRET: "${WECHAT_CORPSECRET:-请替换}"
      WECHAT_AGENTID: "${WECHAT_AGENTID:-请替换}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ==================== MySQL 8.0 ====================
  mysql:
    image: mysql:8.0
    container_name: wg-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_2024
      MYSQL_DATABASE: wechat_group
      MYSQL_USER: wechat_app
      MYSQL_PASSWORD: wechat_pass_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ==================== Redis 7（共享 Session） ====================
  redis:
    image: redis:7-alpine
    container_name: wg-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ==================== RabbitMQ 消息队列 ====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wg-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ==================== Elasticsearch 搜索引擎 ====================
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: wg-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ==================== Apache Kafka 流处理平台 ====================
  kafka:
    image: bitnami/kafka:3.6
    container_name: wg-kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  mysql-data:
  redis-data:
  es-data:
